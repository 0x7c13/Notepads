version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "nuget"
    # The solution covers product projects and native packages.config. Standalone
    # test/tool projects need their own discovery roots; / alone is insufficient.
    directories:
      - "/"
      - "/src"
      - "/src/Notepads.Native/Tools/Tool"
      - "/tests/UnitTests"
      - "/tests/IntegrationTests"
      - "/tests/IntegrationTests/Support/DragDrop.Peer"
    target-branch: "v2"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
