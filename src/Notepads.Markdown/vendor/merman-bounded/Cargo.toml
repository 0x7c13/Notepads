[workspace]
members = ["merman-core", "merman-render", "lalrpop-util"]
default-members = ["merman-core", "merman-render", "lalrpop-util"]
resolver = "3"

[patch.crates-io]
merman-core = { path = "merman-core" }
merman-render = { path = "merman-render" }
lalrpop-util = { path = "lalrpop-util" }

[profile.release]
panic = "unwind"
codegen-units = 1
