[package]
name = "markdown-memory"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
allocator-api2 = { version = "=0.2.21", default-features = false, features = ["alloc"] }
hashbrown = { version = "=0.17.1", default-features = false, features = ["equivalent", "allocator-api2"] }
rustc-hash = "=2.1.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
