[package]
name = "markdown-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Platform-independent document foundation for Notepads Markdown"

[dependencies]
comrak = { version = "=0.56.0", path = "../../vendor/comrak-0.56.0", default-features = false, features = ["shortcodes"] }
emojis = { version = "=0.9.0", default-features = false }
finl_unicode = { version = "=1.5.0", default-features = false, features = ["categories"] }
htmlize = { version = "=1.1.0", features = ["unescape"] }
lol_html = "=3.0.2"
saphyr-parser = { version = "=0.3.4", default-features = false }
ryu-js = "=1.0.3"
indexmap = { version = "=2.14.2", features = ["serde"] }
serde_json = { version = "=1.0.154", features = ["raw_value"] }
toml = { version = "=1.1.2", default-features = false, features = ["parse", "preserve_order"] }
toml_parser = { version = "=1.1.2", default-features = false }

syntect = { version = "=5.3.0", path = "../../vendor/syntect", default-features = false, features = ["parsing", "regex-fancy"] }

[lints]
workspace = true
