[package]
name = "markdown-mermaid"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
markdown-core = { path = "../markdown-core", version = "=0.0.1" }
markdown-memory = { path = "../markdown-memory", version = "=0.0.1" }
merman-core = { version = "=0.9.2", default-features = false, features = ["diagram-flowchart"] }
unicode-segmentation = "=1.13.3"
finl_unicode = "=1.5.0"
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data"] }

[lints.rust]
unsafe_code = "forbid"
